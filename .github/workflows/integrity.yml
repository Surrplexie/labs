name: Repo Integrity

# Runs on every push and pull request to catch structural issues,
# forbidden extensions, and PII leaks before they are merged/public.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:   # manual trigger from Actions tab

jobs:
  integrity:
    name: Validate + Redact Check
    runs-on: windows-latest   # keeps path behaviour identical to local scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history; validate needs all tracked files

      # -----------------------------------------------------------------------
      # 1. Structural integrity - validate.ps1
      #    Runs all 18 checks (kind-aware); fails on any FAIL-level finding.
      #    -FailOnWarn intentionally NOT set -- WARNs (e.g. thin skeletons,
      #    missing skills on in-progress engagements) don't block commits.
      # -----------------------------------------------------------------------
      - name: Structural integrity (validate.ps1)
        shell: pwsh
        run: |
          $result = & powershell -ExecutionPolicy Bypass `
            -File "${{ github.workspace }}\30_scripts\validate.ps1" `
            -Root "${{ github.workspace }}"
          Write-Host $result
          exit $LASTEXITCODE

      # -----------------------------------------------------------------------
      # 2. Redaction check - redact-check.ps1
      #    Scans .md / .csv / .txt for non-VM user paths, email addresses,
      #    and internal hostnames.  Any FAIL-level hit blocks the build.
      # -----------------------------------------------------------------------
      - name: Redaction check (redact-check.ps1)
        shell: pwsh
        run: |
          $result = & powershell -ExecutionPolicy Bypass `
            -File "${{ github.workspace }}\30_scripts\redact-check.ps1" `
            -Root "${{ github.workspace }}"
          Write-Host $result
          exit $LASTEXITCODE

      # -----------------------------------------------------------------------
      # 3. Schema version + engagement_kind check
      #    Verifies every active findings file carries schema_version (1 or 2)
      #    and that all non-empty tracker rows have engagement_kind set.
      #    Implemented inline so it can evolve independently of validate.ps1.
      # -----------------------------------------------------------------------
      - name: Schema version and kind check
        shell: pwsh
        run: |
          $root      = "${{ github.workspace }}"
          $tracker   = Import-Csv "$root\samples_tracker.csv"
          $active    = $tracker | Where-Object { $_.status.Trim().ToLower() -ne 'empty' }
          $missing   = @()
          $noKind    = @()

          foreach ($row in $active) {
            $id   = $row.sample_id.Trim()

            # schema_version check
            $path = "$root\03_findings\$id.md"
            if (Test-Path $path) {
              $raw = Get-Content $path -Raw -Encoding UTF8
              if ($raw -notmatch '(?m)^schema_version\s*:\s*[12]') {
                $missing += $id
              }
            }

            # engagement_kind check
            if ($row.PSObject.Properties.Name -contains 'engagement_kind') {
              if ([string]::IsNullOrWhiteSpace($row.engagement_kind)) {
                $noKind += $id
              }
            }
          }

          $fail = $false
          if ($missing.Count -gt 0) {
            Write-Host "FAIL: schema_version missing or invalid in:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  $_" }
            $fail = $true
          } else {
            Write-Host "PASS: schema_version (1 or 2) present in all $($active.Count) active findings files." -ForegroundColor Green
          }

          if ($noKind.Count -gt 0) {
            Write-Host "WARN: engagement_kind blank for active rows:" -ForegroundColor Yellow
            $noKind | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "PASS: engagement_kind set for all non-empty tracker rows." -ForegroundColor Green
          }

          if ($fail) { exit 1 } else { exit 0 }
